spring.application.name=booklending
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.mvc.servlet.path=/api
spring.web.error.whitelabel.enabled=false
spring.web.error.include-stacktrace=never
# Liquibase properties
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/master.xml
spring.liquibase.default-schema=booklending
spring.liquibase.liquibase-schema=public
spring.jpa.properties.hibernate.default_schema=booklending
spring.jpa.open-in-view=false
# Local DB Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/library?currentSchema=booklending
spring.datasource.username=libraryuser
spring.datasource.password=librarypass
spring.datasource.driver-class-name=org.postgresql.Driver
# Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
# Library Rules
library.rules.borrow.max-active-loan=3
library.rules.borrow.max-duration-days=14
# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO