name: CI/CD to Dev VPS

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_FILENAME: docker-compose-dev.yml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: library
          POSTGRES_USER: libraryuser
          POSTGRES_PASSWORD: librarypass
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (skip tests)
        run: ./gradlew clean build -x test

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
  
  deploy-to-vps:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          port: ${{ secrets.DEV_VPS_SSH_PORT }} # optional, default 22
          script: |
            set -euo pipefail

            cd /opt/booklending  # folder on VPS where your ${{ env.DOCKER_FILENAME }} lives

            if [ -z ${{ secrets.GHCR_PAT }} ] || [ -z ${{ secrets.GHCR_USERNAME }} ]; then
              echo "GHCR credentials are missing. Ensure GHCR_USERNAME and GHCR_PAT secrets are set." >&2
              exit 1
            fi

            echo "Logging in to GHCR as ${{ secrets.GHCR_USERNAME }}..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            echo "Cleaning unused Docker resources..."
            docker system prune -f

            echo "Pulling backend image..."
            docker compose -f ${{ env.DOCKER_FILENAME }} pull backend

            echo "Restarting backend service..."
            docker compose -f ${{ env.DOCKER_FILENAME }} up -d backend --remove-orphans